name: CD - Pulumi GCP Cloud Logging (Apply)

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: GCP project ID
        required: true
        type: string
      region:
        description: "GCP region (Free Tier: us-central1, us-east1, us-west1)"
        required: true
        type: string
        default: us-central1
      bucket_name:
        description: Log bucket ID
        required: true
        type: string
        default: default-log-bucket
      retention_days:
        description: Log retention in days
        required: true
        type: string
        default: "30"
      sink_name:
        description: Log sink name
        required: true
        type: string
        default: my-log-sink
      sink_filter:
        description: Filter for log sink
        required: true
        type: string
        default: "severity >= ERROR"
      metric_name:
        description: Log-based metric name
        required: true
        type: string
        default: error-count-metric
      metric_description:
        description: Metric description
        required: true
        type: string
        default: Count of ERROR severity logs
      metric_filter:
        description: Filter for metric
        required: true
        type: string
        default: severity=ERROR
      metric_kind:
        description: Metric kind (DELTA, GAUGE, CUMULATIVE)
        required: true
        type: string
        default: DELTA
      backend_type:
        description: State backend (local, gcs, pulumi)
        required: true
        type: string
        default: local
      gcs_state_bucket:
        description: GCS bucket for state (if backend_type=gcs)
        required: false
        type: string
        default: ""

env:
  PULUMI_STACK: cloud-logging-${{ github.event.inputs.region }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  GCP_PROJECT: ${{ github.event.inputs.project_id }}
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

jobs:
  apply:
    name: Pulumi Up
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5
        with:
          command: version

      - name: Configure Pulumi Backend
        run: |
          if [ "${{ github.event.inputs.backend_type }}" = "local" ]; then
            pulumi login --local
            echo "Using local filesystem backend"
          elif [ "${{ github.event.inputs.backend_type }}" = "gcs" ]; then
            if [ -z "${{ github.event.inputs.gcs_state_bucket }}" ]; then
              echo "ERROR: gcs_state_bucket required for gcs backend"
              exit 1
            fi
            pulumi login gs://${{ github.event.inputs.gcs_state_bucket }}
            echo "Using GCS backend: gs://${{ github.event.inputs.gcs_state_bucket }}"
          else
            if [ -z "${{ secrets.PULUMI_ACCESS_TOKEN }}" ]; then
              echo "ERROR: PULUMI_ACCESS_TOKEN required for Pulumi Cloud backend"
              exit 1
            fi
            pulumi login --cloud-url https://api.pulumi.com
            echo "Using Pulumi Cloud backend"
          fi

      - name: Configure Pulumi Stack
        run: |
          pulumi stack select ${{ env.PULUMI_STACK }} --create 2>/dev/null || pulumi stack init ${{ env.PULUMI_STACK }}

      - name: Set Pulumi Config
        run: |
          pulumi config set gcp:project ${{ github.event.inputs.project_id }}
          pulumi config set gcp:region ${{ github.event.inputs.region }}
          pulumi config set logging:bucketName ${{ github.event.inputs.bucket_name }}
          pulumi config set logging:retentionDays ${{ github.event.inputs.retention_days }}
          pulumi config set logging:sinkName ${{ github.event.inputs.sink_name }}
          pulumi config set logging:sinkFilter "${{ github.event.inputs.sink_filter }}"
          pulumi config set logging:metricName ${{ github.event.inputs.metric_name }}
          pulumi config set logging:metricDescription "${{ github.event.inputs.metric_description }}"
          pulumi config set logging:metricFilter ${{ github.event.inputs.metric_filter }}
          pulumi config set logging:metricKind ${{ github.event.inputs.metric_kind }}

      - name: Download Go Dependencies
        run: go mod download

      - name: Go Build
        run: go build -v .

      - name: Pulumi Preview
        run: |
          pulumi preview --stack ${{ env.PULUMI_STACK }} --yes

      - name: Pulumi Up
        run: |
          pulumi up --stack ${{ env.PULUMI_STACK }} --yes